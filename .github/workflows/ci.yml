name: Dualsky CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12 and install packages
        run: uv sync

      - name: Build demo database from JSON
        run: uv run python seed.py

      - name: Run all 90 automated tests
        run: uv run pytest -v
